# Copy these values into Streamlit Community Cloud → App settings → Secrets.
# Never commit a real .streamlit/secrets.toml file.

[api_keys]
finnhub = "YOUR_FINNHUB_KEY"
# Canonical Twelve Data key name used by the application:
second_api = "YOUR_TWELVE_DATA_API_KEY"

# Also accepted for backward compatibility:
# TWELVE_DATA_API_KEY = "..."                # root-level secret
# [twelve_data]
# api_key = "..."

# Optional four-key Twelve Data pool. The app rotates these keys per request.
[twelve_data]
key_1 = "YOUR_TWELVE_DATA_KEY_1"
key_2 = "YOUR_TWELVE_DATA_KEY_2"
key_3 = "YOUR_TWELVE_DATA_KEY_3"
key_4 = "YOUR_TWELVE_DATA_KEY_4"


[automation]
auto_connect = true
auto_run_on_login = false
open_lunch_after_calculation = true
